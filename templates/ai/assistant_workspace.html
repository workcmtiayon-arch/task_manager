{% load i18n %}
<section id="ai-assistant-workspace" class="ai-assistant-workspace" hidden aria-labelledby="ai-assistant-title">
    <div class="ai-assistant-workspace__topbar">
        <div class="ai-assistant-modal__header">
            <div class="ai-assistant-modal__icon" aria-hidden="true">✦</div>
            <div>
                <h2 id="ai-assistant-title">{% translate "AI assistant" %}</h2>
        <span class="ai-assistant-modal__status">Gemini</span>
            </div>
        </div>
        <button type="button" class="btn btn--outline" data-ai-close>{% translate "Back to workspace" %}</button>
    </div>
    <div class="ai-chat-window" aria-label="{% translate 'Conversation with the AI assistant' %}">
        <div class="ai-chat-message ai-chat-message--assistant">
            <span>{% translate "Hello. I can help you organize your projects and tasks." %}</span>
        </div>
    </div>
    <p class="ai-assistant-modal__text">{% translate "Ask for a summary, a plan, or task organization." %}</p>
    <form class="ai-assistant-composer" id="ai-assistant-form" data-chat-url="{% url 'ai:chat' %}" aria-label="{% translate 'AI assistant chat area' %}">
        {% csrf_token %}
        <input id="ai-assistant-input" type="text" placeholder="{% translate 'Write your request...' %}" autocomplete="off" required>
        <button id="ai-assistant-send" type="submit" class="btn btn--primary">{% translate "Send" %}</button>
    </form>
</section>
<script src="{% static 'javascript/ai.js' %}"></script>
