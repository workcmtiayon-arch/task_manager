<section id="ai-assistant-workspace" class="ai-assistant-workspace" hidden aria-labelledby="ai-assistant-title">
    <div class="ai-assistant-workspace__topbar">
        <div class="ai-assistant-modal__header">
            <div class="ai-assistant-modal__icon" aria-hidden="true">✦</div>
            <div>
                <h2 id="ai-assistant-title">Assistant IA</h2>
                <span class="ai-assistant-modal__status">Aperçu non fonctionnel</span>
            </div>
        </div>
        <button type="button" class="btn btn--outline" data-ai-close>Retour à l'espace</button>
    </div>
    <div class="ai-chat-window" aria-label="Conversation avec l'assistant IA">
        <div class="ai-chat-message ai-chat-message--system">
            <strong>Information</strong>
            <span>Cette fonctionnalité est encore en cours d'implémentation.</span>
        </div>
        <div class="ai-chat-message ai-chat-message--assistant">
            <span>Bonjour. Je pourrai bientôt vous aider à organiser vos projets et vos tâches.</span>
        </div>
    </div>
    <p class="ai-assistant-modal__text">Pour le moment, rien ne sera envoyé ni analysé.</p>
    <div class="ai-assistant-composer" aria-label="Zone de discussion avec l'assistant IA">
        <input type="text" placeholder="Écrivez votre demande..." disabled>
        <button type="button" class="btn btn--primary" disabled>Envoyer</button>
    </div>
</section>
