map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the TLS scheme asserted by the trusted edge proxy when TLS terminates
# before this Nginx container; otherwise use this server's own scheme.
include /etc/nginx/conf.d/trusted-proxies.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $is_trusted_edge {
    default 0;
    include /etc/nginx/conf.d/trusted-proxies.geo;
}

map "$is_trusted_edge:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http"  http;
}

# TLS is intentionally terminated by external infrastructure in production.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /static/ {
        alias /var/www/static/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Media files remain controlled by Django. They are not mounted into Nginx
    # and are only served by Django when its DEBUG policy enables them.
    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
