services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_manager

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - task_manager

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    networks:
      - task_manager
    command: ["true"]

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/3
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - task_manager
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/3
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - task_manager
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]

  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/3
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - celerybeat_data:/var/lib/celery
    networks:
      - task_manager
    entrypoint: []
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/var/lib/celery/celerybeat-schedule"]

volumes:
  postgres_data:
  static_data:
  media_data:
  celerybeat_data:

networks:
  task_manager:
